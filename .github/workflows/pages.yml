name: Deploy Odyssey to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
      - name: Test event and shortlist behavior
        run: node --test ctrl-alt-fest/tests/*.test.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ctrl-alt-fest
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
